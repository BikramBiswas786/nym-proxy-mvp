<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYM Proxy MVP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 90%; }
        h1 { color: #333; margin-bottom: 10px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; color: #333; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; transition: all 0.3s; }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .result { margin-top: 30px; padding: 20px; background: #f5f5f5; border-radius: 8px; display: none; }
        .result.show { display: block; }
        .result textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: monospace; font-size: 13px; resize: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-group button { flex: 1; padding: 10px; font-size: 14px; }
        .error { color: #e74c3c; margin-top: 10px; font-size: 14px; }
        .success { color: #27ae60; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 NYM Proxy</h1>
        <p class="subtitle">Simple URL to Proxy Link Converter (MVP)</p>
        
        <div class="input-group">
            <label for="url">Enter URL:</label>
            <input type="url" id="url" placeholder="https://example.com">
        </div>
        
        <button onclick="generateToken()">Generate Proxy Link</button>
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <label>Proxy Link:</label>
            <textarea id="proxyLink" readonly></textarea>
            <div class="btn-group">
                <button onclick="copyToClipboard()">📋 Copy</button>
                <button onclick="openProxy()">🔗 Open</button>
            </div>
        </div>
    </div>

    <script>
        function generateToken() {
            const url = document.getElementById('url').value.trim();
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            
            error.textContent = '';
            result.classList.remove('show');
            
            if (!url) {
                error.textContent = '⚠️ Please enter a valid URL';
                return;
            }
            
            try {
                new URL(url);
            } catch (e) {
                error.textContent = '⚠️ Invalid URL format';
                return;
            }
            
            // Base64 encode the URL
            const encoded = btoa(url);
            const proxyLink = `${window.location.origin}/proxy/${encoded}`;
            
            document.getElementById('proxyLink').value = proxyLink;
            result.classList.add('show');
        }
        
        function copyToClipboard() {
            const textarea = document.getElementById('proxyLink');
            textarea.select();
            document.execCommand('copy');
            alert('✅ Copied to clipboard!');
        }
        
        function openProxy() {
            const link = document.getElementById('proxyLink').value;
            window.open(link, '_blank');
        }
        
        // Allow Enter key to generate token
        document.getElementById('url').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateToken();
        });
    </script>
</body>
</html>
